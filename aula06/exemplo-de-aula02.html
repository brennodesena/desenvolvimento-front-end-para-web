<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de classes e CSS interno</title>

    <style>
        .titulo {
            color: blue;
            text-align: center;
        }

        .Caixa01 {
            background-color: yellow;
            border: 2px solid darkblue;
            padding: 20px;
            margin: 20px;
        }

        .caixa02 {
            background-color: rgb(110, 110, 110);
            border: 2px solid darkblue;
            padding: 20px;
            margin: 20px;
        }

        .destaque01,
        .destaque02 {
            color: rgb(148, 148, 9);
            background-color: azure;
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1 class="titulo">Aprendendo classes em CSS</h1>

    <div class="Caixa01">
        <p>
            Estou aprendendo a utilizar classes para personalizar.
        </p>

        <p class="destaque01">
            Este parágrafo utiliza a classe destaque01.
        </p>

        <p class="destaque02">
            Este parágrafo utiliza a classe destaque02.
        </p>
    </div>

    <div class="caixa02">
        <p>Este parágrafo não utiliza nenhuma classe.</p>
    </div>
</body>
</html>
