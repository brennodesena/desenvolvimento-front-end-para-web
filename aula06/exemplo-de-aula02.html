<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<ht>, initial-scale=1.0">
    <title>Exemplo de classes e css interno</title>
    <style>
        .título{
            color:blue;
            text-align: center;
        }

        .Caixa01{
            background-color: yellow;
            border:2px solid darkblue;
            padding: 20px;
            margin: 20px;
        }
        
        .caixa02{
            background-color: rgb(110, 110, 110);
            border:2px solid darkblue;
            padding: 20px;
            margin: 20px;
        }  
        
        .destaque01{
            color:rgb(148, 148, 9)
            background-color:azure;
            font-style: italic;
            padding: 10px;

        }

    </style>

</head>
     <style>{

          .destaque02{
            color:rgb(148, 148, 9)
            background-color:azure;
            font-style: italic;
            padding: 10px;
        }
     </style>}
<body>
    <h1 class="titulo">Aprendendo classes em CSS</h1>
    <div class="Caixa01">
        <p>
            estou aprendendo a utilizar classes para personalizar
        </p>
        <br>
        <p class="destaque01">
            este parágrafo utilizado a classe destaque01
        </p>
        <p class="destaque02">
            este parágrafo utiliza a classe destaque02
        </p>
    <div class="caixa02">
        <p>Este paragrafo não utiliza nenhuma classe</p>
      
</div>
</body>
</html>
