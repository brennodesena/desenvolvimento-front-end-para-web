<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de div com css</title>

    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;

        }
        #principal{
            background-color: gold;
            border: 2px solid chocolate;
            color: white;
        }
    </style>
    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;

        }
        #secundaria{
            background-color: rgb(194, 16, 10);
            border: 2px solid rgb(210, 192, 30);
            color: white;
        }
        hr{
            border: none;
            border-top: 3px solid rgb(71, 80, 97)
            width: 80%;
        }
    </style>

</head>
<body>
    <div id="principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr/>
    <div id="secundaria">
        Esta é outra divisão da página
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>
